# PenguinFin 2: Tauri backend + Leptos interface. Build with `cargo tauri build` from app/src-tauri
# (see app/README.md). The engine and storage crates are shared with 1.x from ../crates.
[workspace]
members = ["src-tauri", "ui"]
resolver = "3"

[workspace.package]
version = "2.0.0-beta.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
