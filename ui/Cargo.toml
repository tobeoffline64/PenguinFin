[package]
name = "penguinfin-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PenguinFin 2: the Leptos interface, compiled to WebAssembly"

[dependencies]
# The engine's types and pure functions; `net` (the FRED HTTP client) stays in the backend.
penguinfin-core = { path = "../crates/penguinfin-core", default-features = false }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["CssStyleDeclaration", "CustomEvent", "DomRect", "DomTokenList", "Element", "HtmlElement", "PointerEvent", "Window", "Document"] }
serde = { workspace = true }
serde-wasm-bindgen = "0.6"
chrono = { workspace = true }
tw_merge = "0.1"
console_error_panic_hook = "0.1"
