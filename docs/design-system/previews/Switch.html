<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="bundle.css">
<script>if (location.hash === "#dark") document.documentElement.dataset.theme = "dark";</script><meta charset="utf-8"><title>Switch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"></head>
<body>
<!-- Static rendition: the same class strings the Rust component emits, styled by the app's compiled stylesheet. -->
<div class="@container bg-background text-foreground p-4 text-sm"><div class="flex max-w-md flex-col gap-4">
<div class="flex items-start justify-between gap-3"><div class="flex flex-col"><span class="text-sm">Set aside payments in a bucket</span><span class="text-xs text-muted-foreground">Adds a payment bucket to the paying account that always holds this debt's planned payment.</span></div><button type="button" role="switch" aria-checked="true" aria-label="Set aside payments in a bucket" data-state="checked" class="inline-flex h-6 w-11 shrink-0 cursor-pointer items-center rounded-full border-2 border-transparent transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background data-[state=checked]:bg-primary data-[state=unchecked]:bg-input" onclick="var s=this.dataset.state==='checked'?'unchecked':'checked';this.dataset.state=s;this.firstElementChild.dataset.state=s;this.setAttribute('aria-checked',s==='checked')"><span data-state="checked" class="block rounded-full ring-0 shadow-lg transition-transform pointer-events-none size-5 bg-background data-[state=checked]:translate-x-5 data-[state=unchecked]:translate-x-0"></span></button></div>
<div class="flex items-start justify-between gap-3"><div class="flex flex-col"><span class="text-sm">Natural scrolling</span><span class="text-xs text-muted-foreground">Content follows your fingers.</span></div><button type="button" role="switch" aria-checked="false" aria-label="Natural scrolling" data-state="unchecked" class="inline-flex h-6 w-11 shrink-0 cursor-pointer items-center rounded-full border-2 border-transparent transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background data-[state=checked]:bg-primary data-[state=unchecked]:bg-input" onclick="var s=this.dataset.state==='checked'?'unchecked':'checked';this.dataset.state=s;this.firstElementChild.dataset.state=s;this.setAttribute('aria-checked',s==='checked')"><span data-state="unchecked" class="block rounded-full ring-0 shadow-lg transition-transform pointer-events-none size-5 bg-background data-[state=checked]:translate-x-5 data-[state=unchecked]:translate-x-0"></span></button></div></div></div>

</body>
</html>
