[package]
name = "penguinfin-store"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PenguinFin's storage: the SQLite database, its migrations, backups and exports"

[dependencies]
penguinfin-core = { path = "../penguinfin-core" }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
