[package]
name = "penguinfin-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PenguinFin's finance engine: data model, schedules, projections, debt plans, savings goals and FRED data"

[dependencies]
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# FRED economic data (optional, only when an API key is set). Blocking client used on
# worker threads; rustls with the system's certificate store.
ureq = { version = "2.12", default-features = false, features = ["tls", "native-certs", "proxy-from-env"] }
