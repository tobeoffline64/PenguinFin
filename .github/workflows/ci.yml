# Tests and clippy on Linux and a Windows build on every push and pull request, so problems show
# up before a release is cut.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libdbus-1-dev
      - name: WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.22.2
      - uses: Swatinem/rust-cache@v2
      - name: Styles and interface
        run: |
          npm ci
          npx @tailwindcss/cli -i style/app.css -o assets/app.css --minify
          cd ui && trunk build --release
      - name: Test
        run: cargo test --locked --workspace
      - name: Clippy (backend and crates)
        run: cargo clippy --locked -p penguinfin-app -p penguinfin-core -p penguinfin-store --all-targets -- -D warnings
      - name: Clippy (interface, WebAssembly)
        run: cargo clippy --locked -p penguinfin-ui --target wasm32-unknown-unknown -- -D warnings

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.22.2
      - uses: Swatinem/rust-cache@v2
      - name: Styles and interface
        run: |
          npm ci
          npx @tailwindcss/cli -i style/app.css -o assets/app.css --minify
          cd ui
          trunk build --release
      - name: Test (engine and storage)
        run: cargo test --locked -p penguinfin-core -p penguinfin-store
      - name: Build
        run: cargo build --release --locked -p penguinfin-app --features custom-protocol
