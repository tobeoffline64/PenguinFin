# Tests on Linux and a Windows build on every push and pull request, so problems show up
# before a release is cut. The app-* jobs cover PenguinFin 2 (app/, its own workspace).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libsoup-3.0-dev
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked --workspace
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Test (core library)
        run: cargo test --locked --workspace --lib
      - name: Build
        run: cargo build --release --locked
      - name: Upload PenguinFin.exe
        uses: actions/upload-artifact@v4
        with:
          name: penguinfin-windows-ci
          path: target/release/penguinfin.exe

  app-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libdbus-1-dev
      - name: WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.22.2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Styles and interface
        run: |
          npx --yes @tailwindcss/cli -i style/app.css -o assets/app.css --minify
          cd app/ui && trunk build --release
      - name: Test
        working-directory: app
        run: cargo test --locked --workspace
      - name: Clippy (backend)
        working-directory: app
        run: cargo clippy --locked -p penguinfin-app --all-targets -- -D warnings
      - name: Clippy (interface, WebAssembly)
        working-directory: app
        run: cargo clippy --locked -p penguinfin-ui --target wasm32-unknown-unknown -- -D warnings

  app-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.22.2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Styles and interface
        run: |
          npx --yes @tailwindcss/cli -i style/app.css -o assets/app.css --minify
          cd app/ui
          trunk build --release
      - name: Build
        working-directory: app
        run: cargo build --release --locked -p penguinfin-app --features custom-protocol
