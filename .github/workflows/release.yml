# Publishes a GitHub release with the flatpak bundle and source archive.
#
# Triggers:
#   - push to main: releases v<version from Cargo.toml> if that release doesn't exist yet
#     (so bumping `version` in Cargo.toml and pushing cuts a new release)
#   - pushing a v* tag, or running the workflow manually
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  flatpak:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-24.04
    container:
      # Fedora image with flatpak and flatpak-builder preinstalled.
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo (for vendoring crates only)
        run: dnf install -y cargo git

      - name: Build flatpak bundle
        run: ./build-flatpak.sh

      - name: Source archive
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git archive --format=tar.gz --prefix="PenguinFin-${VERSION}/" \
            -o "dist/penguinfin-${VERSION}-source.tar.gz" HEAD

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: penguinfin-${{ env.VERSION }}
          path: dist/*

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: PenguinFin ${{ env.VERSION }}
          body_path: .github/release-notes.md
          files: dist/*
