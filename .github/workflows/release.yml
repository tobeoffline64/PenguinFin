# Publishes a GitHub release with the Linux flatpak, the Windows zip and the source archive.
#
# Triggers:
#   - push to main: releases v<version from Cargo.toml> if that release doesn't exist yet
#     (so bumping `version` in Cargo.toml and pushing cuts a new release)
#   - pushing a v* tag, or running the workflow manually
name: Release

on:
  push:
    branches: [main]
    tags: ["v1.*"]
  workflow_dispatch:

permissions:
  contents: write

# One release build at a time; a queued run re-checks and skips if the release now exists.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  flatpak:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          # Ubuntu 24.04 blocks unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build flatpak bundle
        run: ./build-flatpak.sh --clean

      - name: Source archive
        run: |
          git archive --format=tar.gz --prefix="PenguinFin-${VERSION}/" \
            -o "dist/penguinfin-${VERSION}-source.tar.gz" HEAD

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # MSVC toolchain (preinstalled). WebView2's loader is linked statically, so the
      # .exe needs no extra DLLs; Windows 10/11 already ship the WebView2 runtime.
      - name: Build
        run: cargo build --release --locked

      - name: Package zip
        shell: pwsh
        run: |
          $name = "PenguinFin-$env:VERSION-windows-x64"
          New-Item -ItemType Directory -Force -Path $name, dist | Out-Null
          Copy-Item target/release/penguinfin.exe "$name/PenguinFin.exe"
          if (Test-Path target/release/WebView2Loader.dll) { Copy-Item target/release/WebView2Loader.dll $name }
          Copy-Item LICENSE "$name/LICENSE.txt"
          Copy-Item packaging/windows/README.txt $name
          Compress-Archive -Path $name -DestinationPath "dist/$name.zip"
          Get-ChildItem dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  publish:
    needs: [check, flatpak, windows]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: PenguinFin ${{ env.VERSION }}
          body_path: .github/release-notes.md
          files: dist/*
