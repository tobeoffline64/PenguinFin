[package]
name = "penguinfin"
version = "1.0.0"
edition = "2024"
description = "Offline personal finance planner: recurring expenses, bills, income and investment projections"
license = "MIT"

[dependencies]
# Pinned like rust-ui/ui: 0.7.10 has no matching dioxus-desktop release.
dioxus = { version = "=0.7.9", default-features = false, features = ["desktop", "launch", "macro", "html", "signals", "hooks"] }
tw_merge = { version = "0.1" }
strum = { version = "0.28", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-channel = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
