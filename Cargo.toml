# PenguinFin 2: Tauri backend (src-tauri) + Leptos interface (ui), on the engine and storage crates
# in crates/. Build with `cargo tauri build` from src-tauri (see docs/ARCHITECTURE.md).
[workspace]
members = ["src-tauri", "ui", "crates/penguinfin-core", "crates/penguinfin-store"]
default-members = ["src-tauri", "crates/penguinfin-core", "crates/penguinfin-store"]
resolver = "3"

[workspace.package]
version = "2.0.0-beta.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
